<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Desafios Supera: Sudoku.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AE%3C/text%3E%3C/svg%3E">
<title>Desafios Supera - Sudoku</title>
<link rel="stylesheet" href="css/style.css">
<style>
body { padding: 20px 10px; background: var(--bg); font-family: system-ui, sans-serif; }
.header { max-width: 800px; margin: 0 auto 24px; text-align: center; }
.header h1 { margin-bottom: 8px; color: var(--ink); }
.header p { color: var(--mut); }
.nav-top { display:flex; justify-content:center; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
.nav-top a { padding:10px 18px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); text-decoration:none; font-weight:600; }
#desafio-container { max-width: 800px; margin: 0 auto; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
#sudoku-container { text-align:center; }
.sudoku-grid { display:grid; grid-template-columns:repeat(9, 44px); grid-template-rows:repeat(9, 44px); gap:1px; background:var(--line); border:2px solid var(--line); margin:0 auto 20px; }
.sudoku-cell { background:var(--card); display:flex; align-items:center; justify-content:center; position:relative; }
.sudoku-cell.thick-right { border-right:2px solid var(--line); }
.sudoku-cell.thick-bottom { border-bottom:2px solid var(--line); }
.sudoku-input { width:42px; height:42px; text-align:center; font-size:1.5rem; border:none; background:transparent; color:var(--ink); font-weight:600; padding:0; margin:0; outline:none; }
.sudoku-input.fixed { color:var(--ink); font-weight:700; background:var(--dec); }
.sudoku-input:focus { background:rgba(255,122,0,0.1); }
.sudoku-input.correct { background:rgba(31,122,62,0.15); color:#1f7a3e; }
.sudoku-input.error { background:rgba(255,0,110,0.15); color:#ff006e; }
.numpad { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
.numpad button { width:44px; height:44px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:1.2rem; font-weight:700; cursor:pointer; }
.numpad button:hover { background:var(--dec); }
.numpad button.selected { background:var(--acc); color:#fff; }
.controls { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin-top:16px; }
.controls .btn { padding:10px 16px; }
.status { text-align:center; margin:16px 0; }
.status span { font-size:1.2rem; font-weight:700; color:var(--acc); }
.status small { display:block; margin-top:6px; color:var(--mut); }
#niveis { padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-weight:600; }
</style>
</head>
<body>
<div class="header">
  <h1>🎲 Sudoku</h1>
  <p>Complete a grade preenchendo as células vazias com números de 1 a 9</p>
</div>

<div class="nav-top">
  <a href="index.html" style="padding:10px 18px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); text-decoration:none; font-weight:600;">🏠 Voltar ao Menu</a>
  <select id="niveis">
    <option value="facil">Fácil</option>
    <option value="intermediario">Intermediário</option>
    <option value="dificil">Difícil</option>
    <option value="avancado">Avançado</option>
    <option value="expert">Expert</option>
  </select>
</div>

<div id="desafio-container">
  <div id="sudoku-container">
    <div id="timer" class="status">
      <span id="tempo">00:00</span>
      <small id="status-msg">Selecione um nível e clique em Novo Jogo</small>
    </div>
    <div id="sudoku-grid" class="sudoku-grid"></div>
    <div class="numpad" id="numpad">
      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button data-num="0" style="background:#f0f0f0;">⌫</button>
    </div>
    <div class="controls">
      <button class="btn" id="btn-novo">Novo Jogo</button>
      <button class="btn" id="btn-verificar">Verificar</button>
      <button class="btn" id="btn-dica">Dica</button>
    </div>
  </div>
</div>

<script src="js/helpers.js"></script>
<script src="js/sudoku.js"></script>
<script>
(function() {
  const GRID_SIZE = 9;
  const CELL_SIZE = 44;

  let gridData = [];
  let solutionData = [];
  let selectedCell = null;
  let timerInterval = null;
  let seconds = 0;
  let currentLevel = 'facil';

  const gridEl = document.getElementById('sudoku-grid');
  const tempoEl = document.getElementById('tempo');
  const statusMsg = document.getElementById('status-msg');

  function formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = (sec % 60).toString().padStart(2, '0');
    return m + ':' + s;
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    seconds = 0;
    tempoEl.textContent = '00:00';
    timerInterval = setInterval(() => {
      seconds++;
      tempoEl.textContent = formatTime(seconds);
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
  }

  function createGrid() {
    gridEl.innerHTML = '';
    gridData = [];

    for (let r = 0; r < GRID_SIZE; r++) {
      const row = [];
      for (let c = 0; c < GRID_SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = 'sudoku-cell';
        if ((c + 1) % 3 === 0 && c < 8) cell.classList.add('thick-right');
        if ((r + 1) % 3 === 0 && r < 8) cell.classList.add('thick-bottom');

        const input = document.createElement('input');
        input.className = 'sudoku-input';
        input.dataset.row = r;
        input.dataset.col = c;

        input.addEventListener('focus', () => {
          if (selectedCell) selectedCell.input.classList.remove('selected');
          selectedCell = { input, r, c };
          input.classList.add('selected');
        });

        input.addEventListener('click', () => {
          if (selectedCell) selectedCell.input.classList.remove('selected');
          selectedCell = { input, r, c };
          input.classList.add('selected');
        });

        input.addEventListener('keydown', (e) => {
          if (e.key >= '1' && e.key <= '9') {
            e.preventDefault();
            input.value = e.key;
            input.classList.remove('correct', 'error');
          } else if (e.key === 'Backspace' || e.key === 'Delete') {
            e.preventDefault();
            input.value = '';
            input.classList.remove('correct', 'error');
          }
        });

        cell.appendChild(input);
        gridEl.appendChild(cell);
        row.push({ input, fixed: false });
      }
      gridData.push(row);
    }
  }

  function novoJogo(nivel) {
    stopTimer();
    currentLevel = nivel;

    const puzzle = SudokuGenerator.generateSudoku(nivel);
    gridData = [];
    solutionData = puzzle.solution;

    const niveis = { facil: 'Fácil', intermediario: 'Intermediário', dificil: 'Difícil', avancado: 'Avançado', expert: 'Expert' };
    statusMsg.textContent = 'Nível: ' + niveis[nivel];

    createGrid();
    startTimer();

    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const val = puzzle.grid[r][c];
        if (val !== 0) {
          gridData[r][c].input.value = val;
          gridData[r][c].input.classList.add('fixed');
          gridData[r][c].fixed = true;
        }
      }
    }

    statusMsg.textContent = 'Comece a preencher os números!';
  }

  function verificar() {
    let empty = 0;
    let errors = 0;
    let correct = 0;

    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const val = parseInt(gridData[r][c].input.value);
        if (!val) {
          empty++;
          gridData[r][c].input.classList.remove('correct', 'error');
        } else if (val === solutionData[r][c]) {
          correct++;
          gridData[r][c].input.classList.add('correct');
          gridData[r][c].input.classList.remove('error');
        } else {
          errors++;
          gridData[r][c].input.classList.add('error');
          gridData[r][c].input.classList.remove('correct');
        }
      }
    }

    if (empty === 0 && errors === 0) {
      stopTimer();
      statusMsg.textContent = '🎉 Parabéns! Sudoku completo em ' + formatTime(seconds) + '!';
    } else if (errors > 0) {
      statusMsg.textContent = errors + ' erro(s) encontrado(s). Continue tentando!';
    } else {
      statusMsg.textContent = correct + ' acertos. ' + empty + ' células vazias.';
    }
  }

  function dica() {
    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        if (!gridData[r][c].fixed && !gridData[r][c].input.value) {
          gridData[r][c].input.value = solutionData[r][c];
          gridData[r][c].input.classList.add('correct');
          gridData[r][c].input.classList.remove('error');
          statusMsg.textContent = 'Dica: célula [' + (r+1) + ',' + (c+1) + '] = ' + solutionData[r][c];
          return;
        }
      }
    }
    statusMsg.textContent = 'Jogo completo!';
  }

  // Eventos
  document.getElementById('niveis').addEventListener('change', (e) => {
    novoJogo(e.target.value);
  });

  document.getElementById('btn-novo').addEventListener('click', () => {
    novoJogo(currentLevel);
  });

  document.getElementById('btn-verificar').addEventListener('click', verificar);
  document.getElementById('btn-dica').addEventListener('click', dica);

  // Numpad
  document.getElementById('numpad').addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    if (!selectedCell) return;

    const num = e.target.dataset.num;
    if (num === '0') {
      selectedCell.input.value = '';
      selectedCell.input.classList.remove('correct', 'error');
    } else {
      selectedCell.input.value = num;
      selectedCell.input.classList.remove('correct', 'error');
    }
  });

  // Iniciar com nível Fácil
  novoJogo('facil');
})();
</script>
</body>
</html>
