<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Desafios Supera: Sudoku.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AE%3C/text%3E%3C/svg%3E">
<title>Desafios Supera - Sudoku</title>
<link rel="stylesheet" href="css/style.css">
<style>
body { padding: 20px 10px; background: var(--bg); }
.header { max-width: 800px; margin: 0 auto 24px; text-align: center; }
.header h1 { margin-bottom: 8px; color: var(--ink); }
.header p { color: var(--mut); }
.nav-top { display:flex; justify-content:center; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
.nav-top a, .nav-top button { padding:10px 18px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; transition:all .2s; font-weight:600; text-decoration:none; }
.nav-top a.on, .nav-top button.on { background:var(--acc); color:#fff; border-color:var(--acc); box-shadow:0 4px 12px rgba(255,122,0,0.2); }
#desafio-container { max-width: 800px; margin: 0 auto; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; min-height:400px; position:relative; }
.sudoku-grid { display:grid; grid-template-columns:repeat(9, 1fr); gap:1px; background:var(--line); border:2px solid var(--line); margin:0 auto; width:378px; height:378px; }
.sudoku-cell { background:var(--card); display:flex; align-items:center; justify-content:center; }
.sudoku-cell.row-thick { border-bottom:2px solid var(--line); }
.sudoku-cell.col-thick { border-right:2px solid var(--line); }
.sudoku-cell:last-child { border:none; }
.sudoku-input { width:100%; height:100%; text-align:center; font-size:1.4rem; border:none; background:transparent; color:var(--ink); font-weight:700; outline:none; padding:0; margin:0; }
.sudoku-input:focus { background:rgba(255,122,0,0.1); }
.sudoku-input.correct { background:rgba(31,122,62,0.1); color:#1f7a3e; }
.sudoku-input.error { background:rgba(255,0,110,0.15); color:#ff006e; }
.desafio-controls { text-align:center; margin:20px 0; }
.desafio-controls .btn { margin:4px; }
.desafio-status { text-align:center; margin:16px 0; }
.desafio-msg { display:block; margin-top:8px; font-size:0.95rem; }
select { padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-weight:600; }
</style>
</head>
<body>
<div class="header">
  <h1>🎲 Sudoku</h1>
  <p>Complete a grade preenchendo as células vazias com números de 1 a 9</p>
</div>

<div class="nav-top">
  <a href="index.html" style="padding:10px 18px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); text-decoration:none; font-weight:600;">🏠 Voltar ao Menu</a>
  <select id="sd-nivel-seletor">
    <option value="facil">Fácil</option>
    <option value="intermediario">Intermediário</option>
    <option value="dificil">Difícil</option>
    <option value="avancado">Avançado</option>
    <option value="expert">Expert</option>
  </select>
</div>

<div id="desafio-container">
  <div class="desafio-status">
    <span id="sd-tempo" style="font-size:1.2rem; font-weight:700; color:var(--acc);">0:00</span>
    <span id="sd-msg" class="desafio-msg" style="display:block; margin-top:8px;"></span>
  </div>
  <div id="sudoku-grid" class="sudoku-grid" style="display:none;"></div>
  <div class="desafio-controls" style="display:none;">
    <button class="btn" id="sd-verificar">✅ Verificar</button>
    <button class="btn" id="sd-dica">💡 Dica</button>
    <button class="btn" id="sd-reiniciar">🔄 Reiniciar</button>
  </div>
</div>

<script src="js/helpers.js"></script>
<script src="js/sudoku.js"></script>
<script>
(function() {
  const GRID_SIZE = 9;
  const CELL_SIZE = 42;
  const BOARD_SIZE = GRID_SIZE * CELL_SIZE;

  let currentGrid = [];
  let solutionGrid = [];
  let startTime = 0;
  let timerInterval = 0;
  let level = 'facil';
  let cells = [];

  function formatTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return m + ':' + s.toString().padStart(2, '0');
  }

  function startTimer() {
    startTime = Date.now();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - startTime) / 1000);
      document.getElementById('sd-tempo').textContent = formatTime(elapsed);
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
  }

  function createGrid() {
    const container = document.getElementById('sudoku-grid');
    container.innerHTML = '';
    container.style.display = 'grid';

    for (let r = 0; r < GRID_SIZE; r++) {
      for (let c = 0; c < GRID_SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = 'sudoku-cell' + (r % 3 === 0 ? ' row-thick' : '') + (c % 3 === 0 ? ' col-thick' : '');
        cell.style.width = CELL_SIZE + 'px';
        cell.style.height = CELL_SIZE + 'px';

        const input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 1;
        input.inputMode = 'numeric';
        input.className = 'sudoku-input';
        input.dataset.row = r;
        input.dataset.col = c;

        input.addEventListener('input', function() {
          this.value = this.value.replace(/[^1-9]/g, '');
        });

        cell.appendChild(input);
        container.appendChild(cell);
        cells.push({ row: r, col: c, input, el: cell });
      }
    }
  }

  function newGame(nivel) {
    level = nivel;
    stopTimer();
    document.getElementById('sd-tempo').textContent = '0:00';
    document.getElementById('sd-msg').textContent = '';
    document.getElementById('sd-msg').style.color = 'var(--ink)';

    const puzzle = SudokuGenerator.generateSudoku(nivel);
    currentGrid = puzzle.grid;
    solutionGrid = puzzle.solution;

    cells = [];
    createGrid();
    startTimer();

    cells.forEach(cell => {
      const val = currentGrid[cell.row][cell.col];
      cell.input.value = val || '';
      cell.input.disabled = !!val;
      cell.input.classList.remove('error', 'correct');
    });

    document.getElementById('sd-msg').textContent = 'Nível: ' + nivel.charAt(0).toUpperCase() + nivel.slice(1);
    document.getElementById('sd-msg').style.color = 'var(--acc)';
  }

  function verify() {
    let emptyCount = 0;
    let errors = 0;
    let correct = 0;

    cells.forEach(cell => {
      const val = cell.input.value;
      if (!val) {
        emptyCount++;
        cell.input.classList.remove('error', 'correct');
        return;
      }

      const num = parseInt(val, 10);
      if (num < 1 || num > 9) {
        cell.input.classList.add('error');
        cell.input.classList.remove('correct');
        errors++;
        return;
      }

      if (num === solutionGrid[cell.row][cell.col]) {
        cell.input.classList.add('correct');
        cell.input.classList.remove('error');
        correct++;
      } else {
        cell.input.classList.add('error');
        cell.input.classList.remove('correct');
        errors++;
      }
    });

    if (emptyCount === 0 && errors === 0) {
      stopTimer();
      document.getElementById('sd-msg').textContent = '🎉 Parabéns! Você completou o Sudoku em ' + document.getElementById('sd-tempo').textContent + '!';
      document.getElementById('sd-msg').style.color = '#1f7a3e';
    } else if (errors > 0) {
      document.getElementById('sd-msg').textContent = errors + ' erro(s) encontrado(s). Continue tentando!';
      document.getElementById('sd-msg').style.color = '#ff006e';
    } else {
      document.getElementById('sd-msg').textContent = 'Ainda faltam ' + emptyCount + ' número(s).';
      document.getElementById('sd-msg').style.color = 'var(--acc)';
    }
  }

  function giveHint() {
    let found = false;
    for (const cell of cells) {
      const val = parseInt(cell.input.value, 10);
      if (!val || val !== solutionGrid[cell.row][cell.col]) {
        cell.input.value = solutionGrid[cell.row][cell.col];
        cell.input.classList.remove('error');
        cell.input.classList.add('correct');
        found = true;
        break;
      }
    }
    if (!found) {
      document.getElementById('sd-msg').textContent = 'Jogo completo!';
      document.getElementById('sd-msg').style.color = '#1f7a3e';
    } else {
      document.getElementById('sd-msg').textContent = '💡 Dica aplicada!';
      document.getElementById('sd-msg').style.color = 'var(--acc)';
    }
  }

  function restart() {
    newGame(level);
  }

  document.getElementById('sd-verificar').onclick = verify;
  document.getElementById('sd-dica').onclick = giveHint;
  document.getElementById('sd-reiniciar').onclick = restart;
  document.getElementById('sd-nivel-seletor').onchange = function(e) {
    newGame(e.target.value);
  };

  newGame('facil');
})();
</script>
</body>
</html>
